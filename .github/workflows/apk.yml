name: Build APK
on: workflow_dispatch
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build
        run: |
          mkdir www && cp index.html manifest.json sw.js icon-*.png www/
          npm init -y >/dev/null
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init Wallet com.example.wallet --web-dir www
          npx cap add android
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.CAMERA"/></manifest>#' android/app/src/main/AndroidManifest.xml
          npx cap sync android
          cd android && ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../wallet.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: wallet-${{ github.run_number }}
          name: Wallet APK ${{ github.run_number }}
          files: wallet.apk
