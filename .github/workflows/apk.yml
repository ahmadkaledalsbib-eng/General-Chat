name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html shared.js firebase-config.js logo.svg applock.js patch.js www/
          sed -i 's#<body>#<body><script src="applock.js"></script>#' www/index.html
          sed -i 's#</body>#<script src="patch.js"></script></body>#' www/index.html
          grep -c 'applock.js' www/index.html
          grep -c 'patch.js' www/index.html
      - name: Install Capacitor
        run: npm install
      - name: Add Android project
        run: |
          npx cap add android
          npx cap sync android
      - name: Allow camera and biometrics
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i '/android.permission.INTERNET/a\    <uses-permission android:name="android.permission.CAMERA" />' $M
          sed -i '/android.permission.INTERNET/a\    <uses-permission android:name="android.permission.USE_BIOMETRIC" />' $M
          grep -n "CAMERA\|USE_BIOMETRIC" $M || echo "permission lines not added"
      - name: Add native biometric plugin
        run: |
          APPID=$(node -p "require('./capacitor.config.json').appId")
          DIR=android/app/src/main/java/$(echo $APPID | tr . /)
          echo "appId=$APPID dir=$DIR"
          ls $DIR
          cat > $DIR/BiometricLockPlugin.java <<EOF
          package $APPID;

          import androidx.biometric.BiometricManager;
          import androidx.biometric.BiometricPrompt;
          import androidx.core.content.ContextCompat;
          import androidx.appcompat.app.AppCompatActivity;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.util.concurrent.Executor;

          @CapacitorPlugin(name = "BiometricLock")
          public class BiometricLockPlugin extends Plugin {
            @PluginMethod
            public void authenticate(final PluginCall call) {
              final AppCompatActivity act = getActivity();
              int can = BiometricManager.from(act).canAuthenticate(BiometricManager.Authenticators.BIOMETRIC_WEAK);
              if (can != BiometricManager.BIOMETRIC_SUCCESS) {
                JSObject r = new JSObject();
                r.put("ok", false);
                r.put("reason", can == BiometricManager.BIOMETRIC_ERROR_NONE_ENROLLED ? "none_enrolled" : "unavailable");
                call.resolve(r);
                return;
              }
              final Executor ex = ContextCompat.getMainExecutor(act);
              act.runOnUiThread(new Runnable() {
                @Override
                public void run() {
                  BiometricPrompt bp = new BiometricPrompt(act, ex, new BiometricPrompt.AuthenticationCallback() {
                    @Override
                    public void onAuthenticationSucceeded(BiometricPrompt.AuthenticationResult result) {
                      JSObject r = new JSObject();
                      r.put("ok", true);
                      call.resolve(r);
                    }
                    @Override
                    public void onAuthenticationError(int code, CharSequence msg) {
                      JSObject r = new JSObject();
                      r.put("ok", false);
                      r.put("reason", "error");
                      call.resolve(r);
                    }
                  });
                  BiometricPrompt.PromptInfo info = new BiometricPrompt.PromptInfo.Builder()
                    .setTitle("تأكيد الهوية")
                    .setSubtitle("استخدم بصمتك لفتح التطبيق")
                    .setNegativeButtonText("إلغاء")
                    .setAllowedAuthenticators(BiometricManager.Authenticators.BIOMETRIC_WEAK)
                    .build();
                  bp.authenticate(info);
                }
              });
            }
          }
          EOF
          cat > $DIR/ReceiptKitPlugin.java <<EOF
          package $APPID;

          import android.content.ActivityNotFoundException;
          import android.content.ContentResolver;
          import android.content.ContentValues;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.util.Base64;
          import androidx.core.content.FileProvider;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.OutputStream;

          @CapacitorPlugin(name = "ReceiptKit")
          public class ReceiptKitPlugin extends Plugin {

            @PluginMethod
            public void saveFile(PluginCall call) {
              try {
                String data = call.getString("data");
                String name = call.getString("name", "receipt");
                String mime = call.getString("mime", "image/png");
                if (data == null) { call.reject("no data"); return; }
                if (Build.VERSION.SDK_INT < Build.VERSION_CODES.Q) { call.reject("يتطلب أندرويد 10 أو أحدث"); return; }
                byte[] bytes = Base64.decode(data, Base64.DEFAULT);
                ContentResolver cr = getContext().getContentResolver();
                ContentValues v = new ContentValues();
                v.put(MediaStore.MediaColumns.DISPLAY_NAME, name);
                v.put(MediaStore.MediaColumns.MIME_TYPE, mime);
                Uri col;
                if (mime.startsWith("image/")) {
                  v.put(MediaStore.MediaColumns.RELATIVE_PATH, Environment.DIRECTORY_PICTURES + "/BANK-ADLIB");
                  col = MediaStore.Images.Media.EXTERNAL_CONTENT_URI;
                } else {
                  v.put(MediaStore.MediaColumns.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS + "/BANK-ADLIB");
                  col = MediaStore.Downloads.EXTERNAL_CONTENT_URI;
                }
                v.put(MediaStore.MediaColumns.IS_PENDING, 1);
                Uri uri = cr.insert(col, v);
                if (uri == null) { call.reject("insert failed"); return; }
                OutputStream os = cr.openOutputStream(uri);
                os.write(bytes);
                os.close();
                ContentValues u = new ContentValues();
                u.put(MediaStore.MediaColumns.IS_PENDING, 0);
                cr.update(uri, u, null, null);
                JSObject r = new JSObject();
                r.put("ok", true);
                call.resolve(r);
              } catch (Exception e) {
                call.reject(String.valueOf(e.getMessage()));
              }
            }

            @PluginMethod
            public void shareFile(PluginCall call) {
              try {
                String data = call.getString("data");
                String name = call.getString("name", "receipt");
                String mime = call.getString("mime", "application/pdf");
                String pkg = call.getString("pkg", "");
                String text = call.getString("text", "");
                if (data == null) { call.reject("no data"); return; }
                byte[] bytes = Base64.decode(data, Base64.DEFAULT);
                File dir = new File(getContext().getCacheDir(), "shared");
                dir.mkdirs();
                File f = new File(dir, name);
                FileOutputStream fo = new FileOutputStream(f);
                fo.write(bytes);
                fo.close();
                Uri uri = FileProvider.getUriForFile(getContext(), getContext().getPackageName() + ".fileprovider", f);
                Intent i = new Intent(Intent.ACTION_SEND);
                i.setType(mime);
                i.putExtra(Intent.EXTRA_STREAM, uri);
                if (text != null && text.length() > 0) i.putExtra(Intent.EXTRA_TEXT, text);
                i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                if (pkg != null && pkg.length() > 0) {
                  i.setPackage(pkg);
                  try {
                    getActivity().startActivity(i);
                  } catch (ActivityNotFoundException e) {
                    call.reject("not_installed");
                    return;
                  }
                } else {
                  getActivity().startActivity(Intent.createChooser(i, "مشاركة الإيصال"));
                }
                JSObject r = new JSObject();
                r.put("ok", true);
                call.resolve(r);
              } catch (Exception e) {
                call.reject(String.valueOf(e.getMessage()));
              }
            }
          }
          EOF
          cat > $DIR/MainActivity.java <<EOF
          package $APPID;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              registerPlugin(BiometricLockPlugin.class);
              registerPlugin(ReceiptKitPlugin.class);
              super.onCreate(savedInstanceState);
            }
          }
          EOF
          sed -i '/^dependencies {/a\    implementation "androidx.biometric:biometric:1.1.0"' android/app/build.gradle
          grep -n "biometric" android/app/build.gradle
          mkdir -p android/app/src/main/res/xml
          cat > android/app/src/main/res/xml/file_paths.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <external-path name="my_images" path="." />
              <cache-path name="my_cache_images" path="." />
          </paths>
          EOF
          grep -n "fileprovider" android/app/src/main/AndroidManifest.xml || echo "WARNING: fileprovider not found in manifest"
      - name: Generate app icon from logo.svg
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin imagemagick
          mkdir -p assets
          rsvg-convert -w 1024 -h 1024 logo.svg -o assets/icon-only.png
          rsvg-convert -w 740 -h 740 logo.svg -o /tmp/fg.png
          convert /tmp/fg.png -background none -gravity center -extent 1024x1024 assets/icon-foreground.png
          convert -size 1024x1024 "xc:#1b2250" assets/icon-background.png
          npx @capacitor/assets generate --android
      - name: Set version (increases every build)
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle
      - name: Use the fixed signing key (so updates install over old versions)
        run: |
          test -f lion-debug.keystore || { echo "::error::lion-debug.keystore is missing from the repo root"; exit 1; }
          mkdir -p ~/.android
          cp lion-debug.keystore ~/.android/debug.keystore
          keytool -list -keystore ~/.android/debug.keystore -storepass android | head -6
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Show signing certificate of the built APK
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          $APKSIGNER verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | head -5
      - uses: actions/upload-artifact@v4
        with:
          name: BANK-ADLIB-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
