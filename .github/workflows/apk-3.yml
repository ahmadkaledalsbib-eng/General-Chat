name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html shared.js firebase-config.js logo.svg www/
      - name: Install Capacitor
        run: npm install
      - name: Add Android project
        run: |
          npx cap add android
          npx cap sync android
      - name: Allow camera (for QR scanning)
        run: |
          sed -i '/android.permission.INTERNET/a\    <uses-permission android:name="android.permission.CAMERA" />' android/app/src/main/AndroidManifest.xml
          grep -n CAMERA android/app/src/main/AndroidManifest.xml || echo "camera line not added"
      - name: Generate app icon from logo.svg
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin imagemagick
          mkdir -p assets
          rsvg-convert -w 1024 -h 1024 logo.svg -o assets/icon-only.png
          rsvg-convert -w 740 -h 740 logo.svg -o /tmp/fg.png
          convert /tmp/fg.png -background none -gravity center -extent 1024x1024 assets/icon-foreground.png
          convert -size 1024x1024 "xc:#1b2250" assets/icon-background.png
          npx @capacitor/assets generate --android
      - name: Set version (increases every build)
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
      - name: Use the fixed signing key (so updates install over old versions)
        run: |
          mkdir -p ~/.android
          cp lion-debug.keystore ~/.android/debug.keystore
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: asad-wallet-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
