name: Build APK
on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter create --platforms=android --project-name bank_syria --org com.banksyria .
      - run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.CAMERA"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          sed -i 's#android:label="[^"]*"#android:label="بنك سوريا"#' android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      #- run: dart run flutter_launcher_icons
      - run: flutter build apk --release --dart-define=API=${{ vars.API_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: bank-syria-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: app/build/app/outputs/flutter-apk/app-release.apk
