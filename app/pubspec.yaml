name: my_bank_app
description: "تطبيق المحفظة والتحويلات المالية"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # الأمان والمصادقة (ضروري جدًا للتطبيقات البنكية)
  flutter_secure_storage: ^9.2.2  # لتخزين المفاتيح والتوكينز بشكل مشفر ومحمي
  local_auth: ^2.2.0               # للمصادقة عبر البصمة والوجه (Biometrics)

  # Firebase
  firebase_core: ^3.1.0
  cloud_firestore: ^5.0.1
  firebase_messaging: ^15.0.1
  firebase_storage: ^12.0.1

  # QR Code & Camera
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.1.1

  # Audio & Record for KYC
  record: ^5.1.2
  audioplayers: ^6.0.0

  # Auto Update & System
  ota_update: ^6.0.0
  permission_handler: ^11.3.1
  package_info_plus: ^8.0.0
  provider: ^6.1.2
  intl: ^0.19.0                    # لتنسيق العملات والتواريخ والأرقام

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # مسارات الصور والأيقونات الخاصة بالتطبيق
  assets:
    - assets/images/
    - assets/icons/
