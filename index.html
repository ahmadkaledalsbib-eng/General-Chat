<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دردشة ابن الجبل</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <!-- مكتبة PeerJS للمكالمات الصوتية والمرئية عبر WebRTC -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>
  <div class="app-container">
    <!-- الشريط العلوي -->
    <header class="top-bar">
      <div class="app-title">
        <img src="icon.svg" class="app-icon" alt="Logo">
        <h1>دردشة ابن الجبل</h1>
      </div>
      <div class="header-actions">
        <button id="searchBtn">🔍</button>
        <button id="settingsBtn">⚙️</button>
      </div>
    </header>

    <!-- شريط البحث والتصفية -->
    <div class="search-section">
      <input type="text" id="searchInput" placeholder="بحث...">
      <div class="filter-chips">
        <button class="chip active" data-tab="all">الكل</button>
        <button class="chip" data-tab="direct">الدردشات</button>
        <button class="chip" data-tab="groups">المجموعات</button>
        <button class="chip" data-tab="status">الحالة</button>
      </div>
    </div>

    <!-- قائمة المحادثات الرئيسية -->
    <main class="chat-list" id="chatList">
      <!-- نموذج دردشة فردية -->
      <div class="chat-item" onclick="openChat('أحمد العلي', 'مباشر')">
        <div class="avatar">👤</div>
        <div class="chat-info">
          <div class="chat-header">
            <span class="name">أحمد العلي</span>
            <span class="time">10:42 ص</span>
          </div>
          <p class="last-msg">حياك الله يا غالي، كيف الوضع عندك؟</p>
        </div>
      </div>

      <!-- نموذج مجموعة -->
      <div class="chat-item group" onclick="openChat('مجموعة أحرار الجبل', 'مجموعة')">
        <div class="avatar group-avatar">👥</div>
        <div class="chat-info">
          <div class="chat-header">
            <span class="name">مجموعة أحرار الجبل</span>
            <span class="time">أمس</span>
          </div>
          <p class="last-msg">أبو يعقوب: أرسل المقطع الصوتي هنا...</p>
        </div>
      </div>
    </main>

    <!-- شاشة نافذة المحادثة النشطة (مخفية افتراضياً) -->
    <section class="chat-screen" id="chatScreen">
      <header class="chat-room-header">
        <button onclick="closeChat()">➡️</button>
        <h3 id="activeChatName">الاسم</h3>
        <div class="call-buttons">
          <button onclick="startCall('audio')">📞</button>
          <button onclick="startCall('video')">📹</button>
        </div>
      </header>

      <div class="messages-container" id="messagesContainer"></div>

      <!-- منطقة إدخال الرسائل والصوت -->
      <footer class="chat-input-bar">
        <input type="text" id="messageInput" placeholder="اكتب رسالة...">
        <button id="voiceRecordBtn">🎙️</button>
        <button id="sendBtn" onclick="sendMessage()">أرسل</button>
      </footer>
    </section>

    <!-- واجهة المكالمة الصادقة/الواردة (WebRTC) -->
    <div class="call-overlay" id="callOverlay">
      <div class="video-grid">
        <video id="localVideo" autoplay muted></video>
        <video id="remoteVideo" autoplay></video>
      </div>
      <div class="call-controls">
        <button id="endCallBtn" onclick="endCall()" class="btn-danger">إغلاق المكالمة</button>
      </div>
    </div>

    <!-- زر الإضافة العائم -->
    <button class="fab">+</button>

    <!-- شريط التنقل السفلي -->
    <nav class="bottom-nav">
      <button class="nav-item active">💬<br>الدردشات</button>
      <button class="nav-item">👥<br>المجموعات</button>
      <button class="nav-item">⭕<br>الحالة</button>
      <button class="nav-item">📞<br>المكالمات</button>
      <button class="nav-item">👤<br>جهات الاتصال</button>
    </nav>
  </div>
  <script src="app.js"></script>
</body>
</html>
