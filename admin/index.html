 const L=D.tx.slice().reverse().filter(t=>hit([t.id,uinfo(t.from),uinfo(t.to),t.note||'',t.cur,String(t.amt),(uof(t.from).email||''),(uof(t.to).email||'')]));
 const A=(D.adj||[]).slice().reverse().filter(a=>hit([a.id,uinfo(a.uid),a.note||'',a.cur,String(a.amt)]));
 let h=`<p style="margin:4px 0 10px"><small>عدد الحوالات: ${L.length}${s?' (من '+D.tx.length+')':''}</small></p>`;
 h+=L.map(t=>`<div class="c"><h3 style="margin-bottom:6px;color:var(--ac)">${fmN(t.amt,t.cur)}</h3>${rw('رقم العملية',t.id)}${rw('تاريخ العملية',fdt(t.t))}${rw('المرسل',uinfo(t.from))}${rw('بريد المرسل',uof(t.from).email||'—')}${rw('المستلم',uinfo(t.to))}${rw('بريد المستلم',uof(t.to).email||'—')}${rw('المبلغ',fmN(t.amt,t.cur))}${rw('الملاحظة',t.note||'-')}${rw('إخفاء هوية المرسل',t.anon?'نعم (للمستلم فقط، تراه الإدارة)':'لا')}</div>`).join('')||'<div class="c">لا توجد حوالات</div>';
 h+=`<h3 style="margin:16px 0 8px">عمليات الإدارة على الأرصدة (${A.length})</h3>`;
 h+=A.map(a=>`<div class="c"><h3 style="margin-bottom:6px;color:${a.amt>0?'#2ecc71':'#e74c3c'}">${a.amt>0?'➕ إضافة':'➖ سحب'} ${fmN(Math.abs(a.amt),a.cur)}</h3>${rw('رقم العملية',a.id)}${rw('تاريخ العملية',fdt(a.t))}${rw('المستخدم',uinfo(a.uid))}${rw('الملاحظة',a.note||'-')}</div>`).join('')||'<div class="c"><small>لا توجد عمليات</small></div>';
 return h}
const V={
users(){if(sel){const u=D.users.find(x=>x.id==sel);if(!u)return'';return `<div class="c"><button onclick="sel=null;draw()">← رجوع</button><h3 style="margin-top:8px">${e(u.name)} ${BDG(u,22)}</h3><div class="g"><label><small>email</small><input value="${e(u.email)}" disabled></label>${F.map(f=>`<label><small>${f}</small><input id="f_${f}" value="${e(u[f])}" data-o="${e(u[f])}"></label>`).join('')}${CUR.map(c=>`<label><small>رصيد ${c}</small><input id="b_${c}" type="text" inputmode="decimal" value="${u.bal[c]||0}" data-o="${u.bal[c]||0}"></label>`).join('')}</div><p><small>عند تغيير الرصيد من هنا يصل المستخدم إشعار بالفرق.</small></p><br><button onclick="saveU('${u.id}')">💾 حفظ</button> <button class="${u.active?'r':''}" onclick="tg('${u.id}')">${u.active?'تعطيل الحساب':'تفعيل الحساب'}</button> <button onclick="auth.sendPasswordResetEmail('${e(u.email)}').then(()=>alert('أُرسل رابط إعادة كلمة المرور'))">رابط إعادة كلمة المرور</button></div>
 <div class="c"><h3 style="margin-bottom:6px">إضافة / سحب رصيد</h3><div class="g"><label><small>العملة</small><select id="ac">${CUR.map(c=>`<option>${c}</option>`).join('')}</select></label><label><small>المبلغ</small><input id="aa" type="text" inputmode="decimal" placeholder="0"></label></div><label><small>ملاحظة تظهر للمستخدم (اختياري)</small><input id="an" placeholder="مثال: شحن رصيد"></label><button class="ok2" onclick="adjU('${u.id}',1)">➕ إضافة رصيد</button> <button class="r" onclick="adjU('${u.id}',-1)">➖ سحب رصيد</button><p><small>يصل المستخدم إشعار بصوت: تمت إضافة/سحب رصيد من قبل الإدارة.</small></p></div>
 <div class="c"><h3 style="margin-bottom:6px">التوثيق ونوع الحساب ${BDG(u,22)}</h3>${u.vq&&!u.vf?`<p style="margin-bottom:8px">⏳ طلب توثيق بتاريخ ${fdt(u.vq)}${u.vnote?'<br><small>'+e(u.vnote)+'</small>':''}</p>`:''}<div class="g"><label><small>نوع الحساب</small><select id="vg"><option value="0">مستخدم عادي</option><option value="1" ${u.gov?'selected':''}>جهة حكومية</option></select></label><label><small>التوثيق</small><select id="vtf"><option value="0">غير موثّق</option><option value="1" ${u.vf?'selected':''}>موثّق ✔</option></select></label></div><p><small>العلامة زرقاء للمستخدم العادي، وذهبية للجهة الحكومية، وتظهر فقط عند التوثيق.</small></p><button onclick="setVerify('${u.id}')">💾 حفظ التوثيق</button></div>`}
 return D.users.map(u=>`<div class="c" style="display:flex;justify-content:space-between;align-items:center"><span>${e(u.name)} ${BDG(u,18)}<br><small>${u.pub} • ${u.active?'✅ فعّال':'⛔ معطّل'}${u.gov?' • 🏛 حكومي':''}${u.vq&&!u.vf?' • ⏳ طلب توثيق':''}</small></span><button onclick="sel='${u.id}';draw()">تعديل</button></div>`).join('')||'<div class="c">لا يوجد مستخدمون بعد</div>' },
stop(){const on=CT.off&&Date.now()<CT.until;return `<div class="c"><h3>إيقاف الموقع بالكامل</h3><p style="margin:8px 0">الحالة: <b>${on?'🔴 متوقف':'🟢 يعمل'}</b> <span id="cd" style="direction:ltr;display:inline-block"></span></p><label><small>مدة الإيقاف</small><select id="du"><option value="15">15 دقيقة</option><option value="60">ساعة</option><option value="180">3 ساعات</option><option value="720">12 ساعة</option><option value="1440">24 ساعة</option><option value="x">مدة مخصصة</option></select></label><input id="dx" type="text" inputmode="numeric" placeholder="دقائق (للمدة المخصصة)"><textarea id="ms" rows="2" placeholder="رسالة تظهر للمستخدمين">${e(CT.msg||'')}</textarea><button class="r" onclick="stopSite()">⏸ إيقاف الموقع الآن</button> <button onclick="CTL.set({off:false,until:0,msg:''})">▶ تشغيل الموقع</button><p><small>يظهر للمستخدمين عدّاد تنازلي، ويعود الموقع تلقائياً عند انتهاء المدة.</small></p></div>`},
ver(){const P=D.users.filter(u=>u.vq&&!u.vf),Z=D.users.filter(u=>u.vf);
 return `<h3 style="margin:4px 0 8px">طلبات التوثيق (${P.length})</h3>`+(P.map(u=>`<div class="c"><b>${e(u.name)}</b><br><small>${e(u.pub)} • ${e(u.phone||'')} • ${e(u.email||'')}</small><br><small>${fdt(u.vq)}</small>${u.vnote?`<p style="margin:6px 0">${e(u.vnote)}</p>`:''}<div style="margin-top:8px"><button onclick="approveV('${u.id}',0)">🔵 توثيق كمستخدم</button> <button style="background:#d4a017;color:#111" onclick="approveV('${u.id}',1)">🟡 توثيق كجهة حكومية</button> <button class="r" onclick="rejectV('${u.id}')">رفض</button></div></div>`).join('')||'<div class="c"><small>لا توجد طلبات</small></div>')
 +`<h3 style="margin:16px 0 8px">الحسابات الموثّقة (${Z.length})</h3>`+(Z.map(u=>`<div class="c" style="display:flex;justify-content:space-between;align-items:center"><span>${e(u.name)} ${BDG(u,18)}<br><small>${e(u.pub)} • ${u.gov?'جهة حكومية':'مستخدم'}</small></span><button onclick="sel='${u.id}';tab='users';draw()">تعديل</button></div>`).join('')||'<div class="c"><small>لا توجد حسابات موثّقة</small></div>')},
look(){const cu=THEMES[CT.bt]?CT.bt:'royal';return `<div class="c"><h3 style="margin-bottom:10px">المظهر — يتغيّر في التطبيق واللوحة بضغطة</h3><div class="th">${Object.entries(THEMES).map(([k,t])=>`<button class="${k==cu?'on':''}" onclick="CTL.set({bt:'${k}'}).then(draw)"><span class="sw"><i style="background:${t.bg}"></i><i style="background:${t.card}"></i><i style="background:${t.ac}"></i><i style="background:${t.h2}"></i></span>${t.n}</button>`).join('')}</div></div><div class="c"><h3 style="margin-bottom:6px">تفاصيل الموقع</h3><label><small>اسم الموقع / التطبيق</small><input id="bn" value="${e(CT.bn||'')}" placeholder="بنك إدلب المركزي"></label><label><small>نص التذييل (اتركه فارغاً للنص التلقائي)</small><input id="bf" value="${e(CT.bf||'')}" placeholder="جميع الحقوق محفوظة لدى ..."></label><label><small>لون التمييز (اختياري)</small><input id="ba" type="color" value="${CT.ba||'#6b82d6'}" oninput="this.dataset.ch=1" style="height:46px"></label><button onclick="saveLook()">💾 حفظ</button> <button class="r" onclick="CTL.set({ba:''}).then(draw)">إعادة اللون الافتراضي</button></div>`},
rates(){const r=D.rates||{};return `<div class="c"><h3>أسعار الصرف (مقابل 1 دولار)</h3><label><small>USD — الدولار هو العملة الأساسية وقيمته 1 دائماً</small><input id="r_USD" value="1" disabled></label><label><small>SYP — كم ليرة سورية تساوي 1 دولار (مثال: 15000)</small><input id="r_SYP" type="text" inputmode="decimal" value="${r.SYP}"></label><label><small>عمولة التحويل بين العملات (%) — تُخصم من المبلغ الناتج</small><input id="r_fee" type="text" inputmode="decimal" value="${D.feePct||0}"></label><label><small>عمولة ثابتة بالدولار ($) على كل عملية تحويل</small><input id="r_fu" type="text" inputmode="decimal" value="${D.feeUsd||0}"></label><button onclick="saveRates()">حفظ الأسعار والعمولة</button></div>`},
tx(){return `<div class="nofl"><input id="qs" placeholder="🔍 بحث: رقم العملية، اسم، رقم حساب، مبلغ، ملاحظة..." value="${e(q)}" oninput="q=this.value;$('#txl').innerHTML=txList()"></div><div id="txl">${txList()}</div>`},
sup(){const us=[...new Set(D.msgs.map(m=>m.uid))];if(sel){return `<div class="c"><button onclick="sel=null;draw()">← رجوع</button><h3>${e(nm(sel))}</h3>${D.msgs.filter(m=>m.uid==sel).map(m=>`<p style="text-align:${m.from=='u'?'start':'end'}"><span style="background:${m.from=='u'?'#333':'#d4a017'};color:${m.from=='u'?'#eee':'#111'};padding:6px 10px;border-radius:10px;display:inline-block;margin:3px">${e(m.text)}</span></p>`).join('')}<textarea id="rp" rows="2" placeholder="الرد..."></textarea><button onclick="reply('${sel}')">إرسال الرد</button></div>`}
 return us.map(id=>`<div class="c" onclick="sel='${id}';draw()" style="cursor:pointer">💬 ${e(nm(id))}<br><small>${e(D.msgs.filter(m=>m.uid==id).pop().text)}</small></div>`).join('')||'<div class="c">لا رسائل</div>'},
push(){return `<div class="c"><h3>إشعار منبثق بصوت</h3><select id="pu"><option value="0">كل المستخدمين</option>${D.users.map(u=>`<option value="${u.id}">${e(u.name)}</option>`).join('')}</select><textarea id="pt" rows="2" placeholder="نص الإشعار"></textarea><button onclick="pushN()">إرسال</button></div>`},
sys(){return `<div class="c"><h3>النظام</h3><label><small>رقم الإصدار</small><input id="vv" value="${e(D.ver)}"></label><button onclick="saveVer()">حفظ</button> <button class="r" onclick="auth.signOut()">تسجيل الخروج</button></div><div class="c"><h3>سجل الأخطاء</h3><small>${(D.log||[]).length?D.log.map(e).join('<br>'):'لا أخطاء'}</small></div>`}};
function setVerify(id){const g=+$('#vg').value,v=+$('#vtf').value;
 M(d=>{const u=d.users.find(x=>x.id==id);if(!u)throw new Error('المستخدم غير موجود');const was=u.vf?1:0,wg=u.gov?1:0;u.gov=g;u.vf=v;if(v)u.vq=0;
  if(v&&(!was||wg!=g))pn(d,id,g?'🟡 تم توثيق حسابك كجهة حكومية':'🔵 تم توثيق حسابك');
  else if(!v&&was)pn(d,id,'⚠️ أُلغي توثيق حسابك')},'تم حفظ التوثيق')}
function approveV(id,g){M(d=>{const u=d.users.find(x=>x.id==id);if(!u)throw new Error('المستخدم غير موجود');u.vf=1;u.gov=g;u.vq=0;pn(d,id,g?'🟡 تم توثيق حسابك كجهة حكومية':'🔵 تم توثيق حسابك')},g?'تم التوثيق كجهة حكومية':'تم توثيق المستخدم')}
function rejectV(id){const r=prompt('سبب الرفض (اختياري)');if(r===null)return;M(d=>{const u=d.users.find(x=>x.id==id);if(!u)throw new Error('المستخدم غير موجود');u.vq=0;pn(d,id,'❌ رُفض طلب التوثيق'+(r.trim()?' — '+r.trim():''))},'تم رفض الطلب')}
function saveLook(){const b=$('#ba');CTL.set({bn:$('#bn').value.trim(),bf:$('#bf').value.trim(),ba:b.dataset.ch?b.value:(CT.ba||'')}).then(()=>{draw();alert('تم الحفظ')}).catch(x=>alert(aerr(x)))}
function saveRates(){
 const syp=nz($('#r_SYP').value),pc=nz0($('#r_fee').value),fu=nz0($('#r_fu').value);
 if(!(syp>0))return alert('سعر الليرة غير صالح');
 if(isNaN(pc)||pc<0||pc>100)return alert('نسبة العمولة يجب أن تكون بين 0 و 100');
 if(isNaN(fu)||fu<0)return alert('العمولة الثابتة غير صالحة');
 M(d=>{d.rates=d.rates||{};d.rates.SYP=syp;d.rates.USD=1;d.feePct=pc;d.feeUsd=fu},'تم تحديث الأسعار والعمولة')}
/* إشعار للمستخدم + سجل عملية الإدارة */
function notify(d,uid,delta,cur,note){
 const u=d.users.find(x=>x.id==uid),add=delta>0,a=Math.abs(delta),t=Date.now();
 d.notif.push({id:'n'+t+Math.random().toString(36).slice(2,6),uid,txt:(add?'💰 تمت إضافة ':'➖ تم سحب ')+fmN(a,cur)+(add?' إلى رصيدك':' من رصيدك')+' من قبل الإدارة'+(note?' — '+note:'')+' • رصيدك الآن: '+fmN(u.bal[cur],cur),snd:add?'in':'adm'});
 (d.adj=d.adj||[]).push({id:'AD'+t.toString(36).toUpperCase(),uid,cur,amt:delta,t,note:note||''})}
function adjU(id,sign){
 const c=$('#ac').value,a=nz($('#aa').value),n=$('#an').value.trim();
 if(!(a>0))return alert('أدخل مبلغاً صحيحاً');
 M(d=>{const u=d.users.find(x=>x.id==id);if(!u)throw new Error('المستخدم غير موجود');
  u.bal=u.bal||{};if(sign<0&&(u.bal[c]||0)<a)throw new Error('الرصيد الحالي أقل من المبلغ المراد سحبه');
  u.bal[c]=(u.bal[c]||0)+sign*a;notify(d,id,sign*a,c,n)},sign>0?'تمت الإضافة وأُرسل إشعار للمستخدم':'تم السحب وأُرسل إشعار للمستخدم')}
function saveU(id){
 const ch={},bd={};let bad=0;
 F.forEach(f=>{const i=$('#f_'+f);if(i.value!==i.dataset.o)ch[f]=i.value});
 CUR.forEach(c=>{const i=$('#b_'+c),nv=nz(i.value),ov=+i.dataset.o;if(isNaN(nv)){bad=1;return}if(nv!==ov)bd[c]=nv-ov});
 if(bad)return alert('قيمة رصيد غير صالحة');
 if(ch.pub&&D.users.some(x=>x.id!=id&&x.pub==ch.pub))return alert('رقم الحساب العام مستخدم لحساب آخر');
 M(d=>{const u=d.users.find(x=>x.id==id);if(!u)throw new Error('المستخدم غير موجود');u.bal=u.bal||{};
  Object.assign(u,ch);
  CUR.forEach(c=>{if(bd[c]){if((u.bal[c]||0)+bd[c]<0)throw new Error('الرصيد الناتج سالب');u.bal[c]=(u.bal[c]||0)+bd[c];notify(d,id,bd[c],c,'')}})},'تم الحفظ')}
function tg(id){const nv=(D.users.find(x=>x.id==id)||{}).active?0:1;M(d=>{const u=d.users.find(x=>x.id==id);if(u)u.active=nv})}
function stopSite(){const m=$('#du').value=='x'?nz($('#dx').value):+$('#du').value;if(!(m>0))return alert('حدد المدة');if(!confirm('إيقاف التطبيق لجميع المستخدمين؟'))return;CTL.set({off:true,until:Date.now()+m*60000,msg:$('#ms').value})}
function reply(id){const t=$('#rp').value.trim();if(!t)return;M(d=>{d.msgs.push({uid:id,from:'a',text:t,t:Date.now()});d.notif.push({id:'n'+Date.now(),uid:id,txt:'🎧 ردّ جديد من الدعم: '+t.slice(0,60),snd:'sup'})})}
function pushN(){const t=$('#pt').value.trim(),u=$('#pu').value;if(!t)return;M(d=>{(u!='0'?[u]:d.users.map(x=>x.id)).forEach((id,i)=>d.notif.push({id:'n'+Date.now()+i,uid:id,txt:'🔔 '+t,snd:'adm'}))},'أُرسل')}
function saveVer(){const v=$('#vv').value;M(d=>{d.ver=v},'تم')}
setInterval(()=>{const c=$('#cd');if(c&&CT.off&&Date.now()<CT.until){const s=Math.floor((CT.until-Date.now())/1000),p=n=>String(n).padStart(2,'0');c.textContent='— متبقي '+p(Math.floor(s/3600))+':'+p(Math.floor(s%3600/60))+':'+p(s%60)}else if(c)c.textContent=''},1000);
draw();
</script></body></html>
