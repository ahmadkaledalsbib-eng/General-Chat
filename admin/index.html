<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>لوحة التحكم</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1230;--card:#1a2050;--line:#232a63;--tx:#f2f4ff;--mut:#9aa3d6;--ac:#6f8cff}
@media(prefers-color-scheme:light){:root{--bg:#eef0fb;--card:#fff;--line:#d5daf2;--tx:#151a3d;--mut:#5b648f}}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font-family:Cairo,Tahoma,sans-serif;max-width:560px;margin:auto;padding:16px 16px 40px}
[hidden]{display:none!important}
h1{font-size:1.2rem;margin:8px 0 14px}
h2{font-size:1rem;margin:20px 0 8px}
label{color:var(--mut);font-size:.88rem}
input,textarea{width:100%;background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:11px;font:inherit;margin:5px 0 10px}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--ac)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{width:100%;background:var(--ac);color:#fff;border:0;border-radius:14px;padding:14px;font:inherit;font-weight:700;cursor:pointer}
#msg{position:sticky;bottom:12px;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:14px}
</style>
</head>
<body>
<section id="login" hidden>
  <h1>دخول المسؤول</h1>
  <label>البريد الإلكتروني</label><input id="em" type="email" dir="ltr" autocomplete="username">
  <label>كلمة المرور</label><input id="pw" type="password" autocomplete="current-password">
  <button class="btn" onclick="login()">دخول</button>
</section>

<section id="panel" hidden>
  <h1>لوحة التحكم</h1>
  <div class="g">
    <div><label>اسم التطبيق</label><input id="nm"></div>
    <div><label>رقم الإصدار</label><input id="ver" dir="ltr"></div>
  </div>
  <label>ما الجديد في هذا التحديث؟ (سطر لكل تعديل)</label>
  <textarea id="log" rows="4"></textarea>

  <h2>أسعار الصرف (مقابل 1 دولار)</h2>
  <div class="g">
    <div><label>يورو</label><input id="rE" type="number" step="any" dir="ltr"></div>
    <div><label>ليرة سورية</label><input id="rS" type="number" step="any" dir="ltr"></div>
  </div>

  <h2>العمولات (%)</h2>
  <div class="g">
    <div><label>الإرسال</label><input id="cs" type="number" step="any" dir="ltr"></div>
    <div><label>تحويل العملة</label><input id="cc" type="number" step="any" dir="ltr"></div>
  </div>

  <h2>خدمة العملاء</h2>
  <label>نص الرسالة</label><input id="st">
  <div class="g">
    <div><label>الهاتف</label><input id="sp" dir="ltr"></div>
    <div><label>واتساب (بدون +)</label><input id="sw" dir="ltr"></div>
  </div>

  <h2>الألوان (اتركها فارغة للافتراضي)</h2>
  <div class="g">
    <div><label>الرئيسي</label><input id="c_ac" placeholder="#6f8cff" dir="ltr"></div>
    <div><label>الخلفية</label><input id="c_bg" placeholder="#0e1230" dir="ltr"></div>
    <div><label>وارد</label><input id="c_in" placeholder="#2fc4a8" dir="ltr"></div>
    <div><label>صادر</label><input id="c_out" placeholder="#ff6b81" dir="ltr"></div>
  </div>

  <button class="btn" style="margin-top:8px" onclick="publish()">نشر التحديث</button>
  <button class="btn" style="margin-top:10px;background:var(--card);color:var(--tx)" onclick="auth.signOut()">تسجيل الخروج</button>
</section>
<div id="msg" hidden></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
const $=i=>document.getElementById(i),g=i=>$(i).value.trim();
firebase.initializeApp(FB_CFG);
const auth=firebase.auth(),ref=firebase.firestore().doc('config/app');
let loadedVer='';
function msg(t){const m=$('msg');m.textContent=t;m.hidden=false;setTimeout(()=>m.hidden=true,3500)}
function login(){auth.signInWithEmailAndPassword(g('em'),$('pw').value).catch(()=>msg('البريد أو كلمة المرور غير صحيحة'))}
auth.onAuthStateChanged(u=>{
  $('login').hidden=!!u;$('panel').hidden=!u;
  if(u)ref.get().then(s=>fill(s.data()||{})).catch(()=>msg('تعذّر تحميل الإعدادات'));
});
function fill(d){
  const r=d.rates||{},c=d.comm||{},s=d.support||{},k=d.colors||{};
  loadedVer=d.version||'1.0.0';
  $('nm').value=d.appName||'المحفظة';$('ver').value=loadedVer;$('log').value=(d.changelog||[]).join('\n');
  $('rE').value=r.EUR||0.92;$('rS').value=r.SYP||13900;
  $('cs').value=c.send||0;$('cc').value=c.cv||0;
  $('st').value=s.text||'';$('sp').value=s.phone||'';$('sw').value=s.wa||'';
  ['ac','bg','in','out'].forEach(x=>$('c_'+x).value=k[x]||'');
}
function publish(){
  let v=g('ver')||'1.0.0';
  if(v===loadedVer){const p=v.split('.');p[p.length-1]=(+p[p.length-1]||0)+1;v=p.join('.')} // رفع تلقائي إذا لم تغيّر الرقم
  const d={appName:g('nm')||'المحفظة',version:v,
    changelog:g('log').split('\n').map(x=>x.trim()).filter(Boolean),
    rates:{USD:1,EUR:+g('rE')||0.92,SYP:+g('rS')||13900},
    comm:{send:+g('cs')||0,cv:+g('cc')||0},
    support:{text:g('st'),phone:g('sp'),wa:g('sw')},colors:{},
    updatedAt:new Date().toISOString()};
  ['ac','bg','in','out'].forEach(x=>{const c=g('c_'+x);if(c)d.colors[x]=c});
  ref.set(d).then(()=>{loadedVer=v;$('ver').value=v;msg('تم النشر. الإصدار '+v)}).catch(()=>msg('فشل النشر. تحقق من القواعد وحساب المسؤول'));
}
</script>
</body>
</html>
