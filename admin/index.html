<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>إدارة</title>
<style>*{box-sizing:border-box;margin:0}body{font-family:system-ui,Tahoma,sans-serif;background:#0b0e13;color:#eee;padding:14px;max-width:900px;margin:auto}
.c{background:#1a1f29;border-radius:14px;padding:14px;margin-bottom:12px}button{font:inherit;border:0;border-radius:10px;padding:9px 12px;background:#d4a017;font-weight:700;cursor:pointer}
input,select,textarea{font:inherit;padding:9px;border-radius:10px;border:1px solid #555;background:#0b0e13;color:#eee;width:100%;margin:4px 0}
.t{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}.t button{background:#1a1f29;color:#eee;white-space:nowrap}.t .on{background:#d4a017;color:#111}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}small{color:#8b93a3}.r{background:#e74c3c;color:#fff}</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="firebase-config.js"></script><script src="shared.js"></script></head><body>
<div id="v"></div>
<script>
let D=load(),tab='users',sel=null,ok=0;const $=s=>document.querySelector(s),foc=()=>document.activeElement&&document.activeElement.matches('input,textarea,select');
const nm=id=>(D.users.find(u=>u.id==id)||{name:'—'}).name,W=()=>save(D);
auth.onAuthStateChanged(fu=>{if(fu&&fu.email==window.ADMIN_EMAIL){ok=1;startMain(()=>{D=load();if(!foc())draw()})}else{if(fu){auth.signOut();alert('هذا الحساب ليس حساب إدارة')}ok=0;stopMain();draw()}});
startCtl(()=>{if(ok&&tab=='stop'&&!foc())draw()});
function draw(){D=load();if(!ok)return $('#v').innerHTML=`<div class="c" style="max-width:340px;margin:80px auto;text-align:center"><h2>🔐 دخول الإدارة</h2><input id="em" type="email" placeholder="البريد" autocomplete="username"><input id="p" type="password" placeholder="كلمة المرور" autocomplete="current-password"><button style="width:100%" onclick="auth.signInWithEmailAndPassword($('#em').value.trim(),$('#p').value).catch(x=>alert(aerr(x)))">دخول</button></div>`;
 const N=[['users','👥 المستخدمون'],['stop','⏸ إيقاف الموقع'],['rates','💱 الأسعار'],['tx','🧾 الحوالات'],['sup','🎧 الدعم'],['push','🔔 إشعارات'],['sys','⚙️ النظام']];
 $('#v').innerHTML=`<h2 style="margin-bottom:10px">🦁 لوحة إدارة محفظة الأسد</h2><div class="t">${N.map(([k,l])=>`<button class="${tab==k?'on':''}" onclick="tab='${k}';sel=null;draw()">${l}</button>`)}</div>`+V[tab]()}
const F=['name','phone','region','pub','priv'];
const V={
users(){if(sel){const u=D.users.find(x=>x.id==sel);if(!u)return'';return `<div class="c"><button onclick="sel=null;draw()">← رجوع</button><h3>${e(u.name)}</h3><div class="g"><label><small>email</small><input value="${e(u.email)}" disabled></label>${F.map(f=>`<label><small>${f}</small><input id="f_${f}" value="${e(u[f])}"></label>`)}${CUR.map(c=>`<label><small>رصيد ${c}</small><input id="b_${c}" type="number" value="${u.bal[c]||0}"></label>`)}</div><br><button onclick="saveU('${u.id}')">💾 حفظ</button> <button class="${u.active?'r':''}" onclick="tg('${u.id}')">${u.active?'تعطيل الحساب':'تفعيل الحساب'}</button> <button onclick="auth.sendPasswordResetEmail('${e(u.email)}').then(()=>alert('أُرسل رابط إعادة كلمة المرور'))">رابط إعادة كلمة المرور</button></div>`}
 return D.users.map(u=>`<div class="c" style="display:flex;justify-content:space-between;align-items:center"><span>${e(u.name)}<br><small>${u.pub} • ${u.active?'✅ فعّال':'⛔ معطّل'}</small></span><button onclick="sel='${u.id}';draw()">تعديل</button></div>`)||'' },
stop(){const on=CT.off&&Date.now()<CT.until;return `<div class="c"><h3>إيقاف الموقع بالكامل</h3><p style="margin:8px 0">الحالة: <b>${on?'🔴 متوقف':'🟢 يعمل'}</b> <span id="cd" style="direction:ltr;display:inline-block"></span></p><label><small>مدة الإيقاف</small><select id="du"><option value="15">15 دقيقة</option><option value="60">ساعة</option><option value="180">3 ساعات</option><option value="720">12 ساعة</option><option value="1440">24 ساعة</option><option value="x">مدة مخصصة</option></select></label><input id="dx" type="number" placeholder="دقائق (للمدة المخصصة)"><textarea id="ms" rows="2" placeholder="رسالة تظهر للمستخدمين">${e(CT.msg||'')}</textarea><button class="r" onclick="stopSite()">⏸ إيقاف الموقع الآن</button> <button onclick="CTL.set({off:false,until:0,msg:''})">▶ تشغيل الموقع</button><p><small>يظهر للمستخدمين عدّاد تنازلي، ويعود الموقع تلقائياً عند انتهاء المدة.</small></p></div>`},
rates(){return `<div class="c"><h3>أسعار الصرف (مقابل 1 دولار)</h3>${CUR.map(c=>`<label><small>${c}</small><input id="r_${c}" type="number" step="any" value="${D.rates[c]}" ${c=='USD'?'disabled':''}></label>`)}<button onclick="CUR.forEach(c=>D.rates[c]=+$('#r_'+c).value);W();alert('تم التحديث')">حفظ الأسعار</button></div>`},
tx(){return D.tx.slice().reverse().map(t=>`<div class="c"><b>${t.id}</b> — ${e(nm(t.from))} ➜ ${e(nm(t.to))}<br>${t.amt} ${t.cur} ${t.anon?'(مخفي)':''} <small>${new Date(t.t).toLocaleString('ar')}</small></div>`).join('')||'<div class="c">لا توجد حوالات</div>'},
sup(){const us=[...new Set(D.msgs.map(m=>m.uid))];if(sel){return `<div class="c"><button onclick="sel=null;draw()">← رجوع</button><h3>${e(nm(sel))}</h3>${D.msgs.filter(m=>m.uid==sel).map(m=>`<p style="text-align:${m.from=='u'?'start':'end'}"><span style="background:${m.from=='u'?'#333':'#d4a017'};color:${m.from=='u'?'#eee':'#111'};padding:6px 10px;border-radius:10px;display:inline-block;margin:3px">${e(m.text)}</span></p>`)}<textarea id="rp" rows="2" placeholder="الرد..."></textarea><button onclick="rep('${sel}')">إرسال الرد</button></div>`}
 return us.map(id=>`<div class="c" onclick="sel='${id}';draw()" style="cursor:pointer">💬 ${e(nm(id))}<br><small>${e(D.msgs.filter(m=>m.uid==id).pop().text)}</small></div>`).join('')||'<div class="c">لا رسائل</div>'},
push(){return `<div class="c"><h3>إشعار منبثق بصوت</h3><select id="pu"><option value="0">كل المستخدمين</option>${D.users.map(u=>`<option value="${u.id}">${e(u.name)}</option>`)}</select><textarea id="pt" rows="2" placeholder="نص الإشعار"></textarea><button onclick="pushN()">إرسال</button></div>`},
sys(){return `<div class="c"><h3>النظام</h3><label><small>رقم الإصدار</small><input id="vv" value="${e(D.ver)}"></label><button onclick="D.ver=$('#vv').value;W();alert('تم')">حفظ</button> <button class="r" onclick="auth.signOut()">تسجيل الخروج</button></div><div class="c"><h3>سجل الأخطاء</h3><small>${D.log.length?D.log.join('<br>'):'لا أخطاء'}</small></div>`}};
function saveU(id){const u=D.users.find(x=>x.id==id);F.forEach(f=>u[f]=$('#f_'+f).value);CUR.forEach(c=>u.bal[c]=+$('#b_'+c).value);W();alert('تم الحفظ')}
function tg(id){const u=D.users.find(x=>x.id==id);u.active=u.active?0:1;W();draw()}
function stopSite(){const m=$('#du').value=='x'?+$('#dx').value:+$('#du').value;if(!(m>0))return alert('حدد المدة');if(!confirm('إيقاف التطبيق لجميع المستخدمين؟'))return;CTL.set({off:true,until:Date.now()+m*60000,msg:$('#ms').value})}
function rep(id){const t=$('#rp').value.trim();if(!t)return;D.msgs.push({uid:id,from:'a',text:t,t:Date.now()});D.notif.push({id:'n'+Date.now(),uid:id,txt:'🎧 ردّ جديد من الدعم: '+t.slice(0,60),snd:'sup'});W();draw()}
function pushN(){const t=$('#pt').value.trim(),u=$('#pu').value;if(!t)return;(u!='0'?[u]:D.users.map(x=>x.id)).forEach((id,i)=>D.notif.push({id:'n'+Date.now()+i,uid:id,txt:'🔔 '+t,snd:'adm'}));W();alert('أُرسل')}
setInterval(()=>{const c=$('#cd');if(c&&CT.off&&Date.now()<CT.until){const s=Math.floor((CT.until-Date.now())/1000),p=n=>String(n).padStart(2,'0');c.textContent='— متبقي '+p(Math.floor(s/3600))+':'+p(Math.floor(s%3600/60))+':'+p(s%60)}else if(c)c.textContent=''},1000);
draw();
</script></body></html>
