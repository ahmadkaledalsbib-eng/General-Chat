<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لوحة الإدارة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1024;--pn:#141a3a;--pn2:#1d2550;--tx:#eef1ff;--mut:#97a0cf;--ac:#7c8cff;--ok:#2fc4a8;--no:#ff6b81;--bd:#2a3366;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
[data-at=paper]{--bg:#f3f1ec;--pn:#fff;--pn2:#ebe7de;--tx:#23201b;--mut:#7a7367;--ac:#2f5d50;--bd:#d9d3c5}
[data-at=emerald]{--bg:#06150f;--pn:#0d2419;--pn2:#143427;--tx:#e6fff3;--mut:#86b8a0;--ac:#3ddc97;--bd:#1d4a37}
[data-at=amber]{--bg:#1a120a;--pn:#271a0f;--pn2:#352413;--tx:#fff3e0;--mut:#c9a97e;--ac:#ffb02e;--bd:#4a3319}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font-family:Cairo,Tahoma,sans-serif;max-width:960px;margin:auto;padding-bottom:calc(30px + env(safe-area-inset-bottom,0px))}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px}
nav{display:flex;gap:6px;overflow-x:auto;padding:0 16px 10px;border-bottom:1px solid var(--bd)}
nav button{background:0;border:0;color:var(--mut);font:inherit;padding:8px 14px;border-radius:99px;white-space:nowrap;cursor:pointer}
nav button.on{background:var(--ac);color:var(--bg);font-weight:700}
main{padding:16px}
h3{font-size:1rem;margin:18px 0 8px}
.p{background:var(--pn);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:10px;display:flex;flex-direction:column;gap:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.grid .p b{font-size:1.25rem}
small,.mut{color:var(--mut);font-size:.85rem}
.r{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
input{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:10px;font:inherit;margin:4px 0 8px}
input[type=color]{padding:2px;height:42px}
label{color:var(--mut);font-size:.88rem;display:block}
.b,.g{border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer}
.b{background:var(--ac);color:var(--bg)}
.g{background:var(--pn2);color:var(--tx)}
.d{color:var(--no)}
.tag{padding:2px 10px;border-radius:99px;font-size:.8rem;background:var(--pn2)}
.tag.ok{color:var(--ok)}.tag.no{color:var(--no)}
.chip{display:inline-block;margin:0 0 6px 6px}
.chip.on{outline:2px solid var(--ac)}
.box{max-width:340px;margin:20vh auto 0;padding:16px;display:flex;flex-direction:column;gap:6px}
#toast{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--ac);color:var(--bg);padding:8px 18px;border-radius:99px;display:none;z-index:9}
</style>
</head>
<body>
<div id="toast"></div>
<div id="root"></div>
<script>
const $=s=>document.querySelector(s),L=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},W=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const CS=['USD','EUR','SYP'],SYM={USD:'$',EUR:'€',SYP:'ل.س'};
const CK=[['bg','الخلفية','#0e1230'],['card','البطاقات','#1a2050'],['card2','البطاقات الثانوية','#232a63'],['tx','النص','#f2f4ff'],['mut','النص الخافت','#9aa3d6'],['ac','اللون الرئيسي','#6f8cff'],['in','الوارد','#2fc4a8'],['out','الصادر','#ff6b81'],['nav','شريط التنقل','#161b45']];
const TH=[['midnight','ليلي'],['paper','ورقي'],['emerald','زمردي'],['amber','عنبري']];
const TABS=[['ov','نظرة عامة'],['us','المستخدمون'],['tr','التحويلات'],['fx','الصرف والعمولة'],['lk','المظهر والرموز'],['st','الإعدادات']];
let tab='ov';
const AD=()=>Object.assign({colors:{},rates:{USD:1,EUR:.92,SYP:13900},comm:{send:0,cv:0},cur:{},support:{text:'للتواصل مع خدمة العملاء',phone:'',wa:''},version:'1.0.0',appName:'المحفظة',theme:'midnight'},L('wallet_admin')||{});
const U=()=>L('wallet'),val=i=>$('#'+i).value;
const fm=(v,c)=>(+v||0).toLocaleString('en',{maximumFractionDigits:2})+' '+((AD().cur[c]||{}).s||SYM[c]);
const tt=m=>{const e=$('#toast');e.textContent=m;e.style.display='block';setTimeout(()=>e.style.display='none',2000)};
const card=(l,v)=>`<div class="p"><small>${l}</small><b>${v}</b></div>`;
const now=()=>{const d=new Date(),p=x=>String(x).padStart(2,'0');return `${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`};
const upd=f=>{const a=AD();f(a);W('wallet_admin',a);tt('تم الحفظ');R()};
const usr=f=>{const u=U();if(!u)return;f(u);W('wallet',u);R()};

function gate(){document.documentElement.dataset.at=AD().theme;if(sessionStorage.adm)return R();const pw=localStorage.getItem('wallet_admin_pw');
$('#root').innerHTML=`<div class="box"><h2>${pw?'دخول الإدارة':'أنشئ كلمة مرور الإدارة'}</h2><input id="gp" type="password" placeholder="كلمة المرور"><button class="b" onclick="gOk()">${pw?'دخول':'حفظ ودخول'}</button></div>`}
function gOk(){const v=val('gp'),pw=localStorage.getItem('wallet_admin_pw');if(!pw){if(v.length<6)return tt('6 أحرف على الأقل');localStorage.setItem('wallet_admin_pw',v)}else if(v!==pw)return tt('كلمة المرور غير صحيحة');sessionStorage.adm=1;R()}
function R(){const a=AD();document.documentElement.dataset.at=a.theme;
$('#root').innerHTML=`<header><b>⚙ ${a.appName} · الإدارة</b><button class="g" onclick="delete sessionStorage.adm;gate()">خروج</button></header><nav>${TABS.map(x=>`<button class="${x[0]==tab?'on':''}" onclick="tab='${x[0]}';R()">${x[1]}</button>`).join('')}</nav><main>${V[tab]()}</main>`}

const V={
ov(){const u=U()||{},tx=u.tx||[],sp=L('wallet_support')||[],fe={};tx.forEach(x=>{if(x.fee)fe[x.c]=(fe[x.c]||0)+x.fee});
return `<div class="grid">${card('المستخدمون',u.acct?1:0)}${card('العمليات',tx.length)}${card('رسائل دعم جديدة',sp.filter(s=>!s.read).length)}</div><h3>إجمالي الأرصدة</h3><div class="grid">${CS.map(c=>card(c,fm((u.bal||{})[c],c))).join('')}</div><h3>العمولات المحصّلة</h3><div class="grid">${CS.map(c=>card(c,fm(fe[c],c))).join('')}</div>`},
us(){const u=U();if(!u||!u.acct)return '<div class="p">لا يوجد مستخدمون بعد.</div>';const m=u.me;
return `<div class="p"><div class="r"><b>${m.name}</b><span class="tag ${u.acct.frozen?'no':'ok'}">${u.acct.frozen?'مجمّد':'نشط'}</span></div><small dir="ltr">@${u.acct.user} · ${m.email} · ${m.phone}</small><small dir="ltr">${m.id}</small>
<h3>الأرصدة</h3><div class="grid">${CS.map(c=>`<label>${c}<input id="bl_${c}" type="number" step="0.01" value="${u.bal[c]}"></label>`).join('')}</div><button class="b" onclick="saveBal()">حفظ الأرصدة</button>
<div class="r" style="margin-top:14px;justify-content:flex-start"><button class="g" onclick="frz()">${u.acct.frozen?'إلغاء التجميد':'تجميد الحساب'}</button><button class="g" onclick="rpw()">تعيين كلمة مرور</button><button class="g d" onclick="delU()">حذف الحساب</button></div></div>
<p class="mut">المستخدمون محفوظون في متصفح هذا الجهاز. لإدارة عدة أجهزة يلزم خادم.</p>`},
tr(){const u=U();const tx=(u&&u.tx)||[];return tx.length?tx.map((x,i)=>`<div class="p"><div class="r"><b>${x.n}</b><b style="color:var(--${x.a>0?'ok':'no'})" dir="ltr">${x.a>0?'+':'−'}${fm(Math.abs(x.a),x.c)}</b></div><small>#${x.id} · ${x.d}${x.fee?` · عمولة ${fm(x.fee,x.c)}`:''}</small>${x.note?`<small>${x.note}</small>`:''}<div class="r" style="justify-content:flex-start"><button class="g" onclick="rev(${i})">استرجاع وإلغاء</button><button class="g d" onclick="usr(u=>u.tx.splice(${i},1))">حذف السجل</button></div></div>`).join(''):'<div class="p">لا توجد عمليات.</div>'},
fx(){const a=AD();return `<div class="p"><h3 style="margin-top:0">أسعار الصرف</h3><small>كم وحدة من العملة تساوي 1 دولار</small>${CS.filter(c=>c!='USD').map(c=>`<label>${c}<input id="fr_${c}" type="number" step="any" value="${a.rates[c]}"></label>`).join('')}
<h3>العمولة</h3><label>عمولة الإرسال %<input id="cm_send" type="number" step="0.01" min="0" value="${a.comm.send}"></label><label>عمولة التحويل بين العملات %<input id="cm_cv" type="number" step="0.01" min="0" value="${a.comm.cv}"></label>
<button class="b" onclick="saveFx()">حفظ</button></div>`},
lk(){const a=AD();return `<div class="p"><h3 style="margin-top:0">ثيم لوحة الإدارة</h3><div>${TH.map(x=>`<button class="g chip ${a.theme==x[0]?'on':''}" onclick="upd(a=>a.theme='${x[0]}')">${x[1]}</button>`).join('')}</div></div>
<div class="p"><h3 style="margin-top:0">ألوان التطبيق</h3><div class="grid">${CK.map(k=>`<label>${k[1]}<input type="color" id="cl_${k[0]}" value="${a.colors[k[0]]||k[2]}"></label>`).join('')}</div><div class="r" style="justify-content:flex-start"><button class="b" onclick="saveCol()">حفظ الألوان</button><button class="g" onclick="upd(a=>a.colors={})">الألوان الافتراضية</button></div></div>
<div class="p"><h3 style="margin-top:0">رموز العملات وأسماؤها</h3>${CS.map(c=>{const o=a.cur[c]||{};return `<div class="grid"><label>${c} · الرمز<input id="cs_${c}" value="${o.s||SYM[c]}"></label><label>الاسم<input id="cn_${c}" value="${o.n||''}" placeholder="اتركه فارغاً للافتراضي"></label></div>`}).join('')}<button class="b" onclick="saveCur()">حفظ الرموز</button></div>`},
st(){const a=AD(),sp=L('wallet_support')||[];return `<div class="p"><label>اسم التطبيق<input id="an" value="${a.appName}"></label><label>رقم الإصدار<input id="av" dir="ltr" value="${a.version}"></label><label>نص خدمة العملاء<input id="sx" value="${a.support.text}"></label><label>هاتف الدعم<input id="sp" dir="ltr" value="${a.support.phone}"></label><label>واتساب (رقم دولي)<input id="sw" dir="ltr" value="${a.support.wa}"></label><button class="b" onclick="saveSt()">حفظ</button></div>
<h3>رسائل الدعم</h3>${sp.length?sp.map((s,i)=>`<div class="p"><div class="r"><b>${s.from}</b><small>${s.d}</small></div><span>${s.msg}</span><div><button class="g d" onclick="W('wallet_support',L('wallet_support').filter((_,j)=>j!=${i}));R()">حذف</button></div></div>`).join(''):'<div class="p">لا توجد رسائل.</div>'}
<div class="p"><label>كلمة مرور الإدارة الجديدة<input id="np" type="password"></label><button class="g" onclick="if(val('np').length<6)return tt('6 أحرف على الأقل');localStorage.setItem('wallet_admin_pw',val('np'));tt('تم التغيير')">تغيير كلمة المرور</button></div>`}
};

function saveBal(){usr(u=>{CS.forEach(c=>{const n=+(+val('bl_'+c)||0).toFixed(2),d=+(n-u.bal[c]).toFixed(2);if(d){u.tx.unshift({id:String(Math.floor(Math.random()*9e4+1e4)),n:'تعديل من الإدارة',d:now(),a:d,c});u.bal[c]=n}})});tt('تم الحفظ')}
function frz(){usr(u=>u.acct.frozen=!u.acct.frozen)}
function rpw(){const p=prompt('كلمة المرور الجديدة (6 أحرف على الأقل)');if(p&&p.length>=6)usr(u=>u.acct.pass=p)}
function delU(){if(confirm('حذف الحساب وكل بياناته نهائياً؟')){localStorage.removeItem('wallet');R()}}
function rev(i){if(confirm('إرجاع الرصيد وحذف العملية؟'))usr(u=>{const x=u.tx[i];u.bal[x.c]=+(u.bal[x.c]-x.a).toFixed(2);u.tx.splice(i,1)})}
function saveFx(){upd(a=>{a.rates={USD:1};CS.filter(c=>c!='USD').forEach(c=>{if(+val('fr_'+c)>0)a.rates[c]=+val('fr_'+c)});a.comm={send:+val('cm_send')||0,cv:+val('cm_cv')||0}})}
function saveCol(){upd(a=>{a.colors={};CK.forEach(k=>a.colors[k[0]]=val('cl_'+k[0]))})}
function saveCur(){upd(a=>{a.cur={};CS.forEach(c=>{a.cur[c]={s:val('cs_'+c)||SYM[c]};if(val('cn_'+c))a.cur[c].n=val('cn_'+c)})})}
function saveSt(){upd(a=>{a.appName=val('an');a.version=val('av');a.support={text:val('sx'),phone:val('sp'),wa:val('sw')}})}
gate();
</script>
</body>
</html>
